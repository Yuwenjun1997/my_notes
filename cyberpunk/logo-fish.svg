<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 12" width="16" height="12" shape-rendering="crispEdges">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(4,3)" filter="url(#glow)">
    <!-- 背鳍（品红） -->
    <rect x="3" y="0" width="2" height="1" fill="#ff00cc"/>
    <!-- 尾鳍分叉（品红）：上叶 -->
    <rect x="0" y="1" width="2" height="2" fill="#ff00cc"/>
    <!-- 尾鳍分叉（品红）：下叶 -->
    <rect x="0" y="4" width="2" height="2" fill="#ff00cc"/>
    <!-- 腹鳍（品红） -->
    <rect x="3" y="6" width="3" height="1" fill="#ff00cc"/>
    <!-- 鱼身（青） -->
    <rect x="3" y="1" width="5" height="1" fill="#00ffff"/>
    <rect x="2" y="2" width="6" height="1" fill="#00ffff"/>
    <rect x="2" y="3" width="5" height="1" fill="#00ffff"/>
    <rect x="2" y="4" width="5" height="1" fill="#00ffff"/>
    <rect x="2" y="5" width="6" height="1" fill="#00ffff"/>
  </g>

  <!-- 眼睛（无光晕，保持清晰） -->
  <g transform="translate(4,3)">
    <rect x="7" y="3" width="1" height="2" fill="#05060f"/>
    <rect x="8" y="3" width="1" height="2" fill="#ffffff"/>
  </g>
</svg>
